<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Гараж — Учёт запчастей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15130f;
    --bg-card:#201c15;
    --bg-card-hi:#28221a;
    --border:#3a3227;
    --border-hi:#4d4230;
    --text:#ece6d6;
    --text-dim:#9c9483;
    --text-faint:#6b6455;
    --rust:#b5502a;
    --rust-hi:#cf6438;
    --brass:#c99a3d;
    --steel:#5b7c8d;
    --violet:#8a6fa8;
    --moss:#7d9463;
    --green:#5c8a4a;
    --danger:#b23a2e;
    --muted:#6b6558;
    --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}
  body{
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(181,80,42,0.08), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 4px);
    padding-bottom:100px;
  }
  .display{font-family:'Oswald',sans-serif; text-transform:uppercase;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, #15130f 80%, rgba(21,19,15,0));
    padding:12px 16px 8px;
    border-bottom:1px solid var(--border);
  }
  .title-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .title-row h1{font-size:19px; letter-spacing:0.5px; margin:0; font-weight:700; color:var(--text);}
  .title-row h1 span{color:var(--rust-hi);}
  .icon-btn{
    background:var(--bg-card); border:1px solid var(--border); color:var(--text-dim);
    width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:15px; cursor:pointer;
  }
  .icon-btn:active{background:var(--bg-card-hi);}

  .stats-row{display:flex; align-items:baseline; gap:0; margin-top:8px; overflow-x:auto; scrollbar-width:none;}
  .stats-row::-webkit-scrollbar{display:none;}
  .stat{display:flex; align-items:baseline; gap:4px; padding-right:12px; margin-right:12px; border-right:1px solid var(--border); white-space:nowrap; flex:0 0 auto;}
  .stat:last-child{border-right:none; margin-right:0; padding-right:0;}
  .stat .n{font-family:'Oswald',sans-serif; font-size:14.5px; font-weight:600; color:var(--brass); line-height:1;}
  .stat .l{font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.4px;}

  .gauge{margin-top:7px; height:4px; border-radius:3px; overflow:hidden; display:flex; background:#0f0d0a; border:1px solid var(--border);}
  .gauge div{height:100%;}

  .filters{display:flex; gap:6px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:6px 12px; border-radius:20px; border:1px solid var(--border);
    background:var(--bg-card); color:var(--text-dim); font-size:12.5px; white-space:nowrap; cursor:pointer; font-weight:500;
  }
  .chip.active{background:var(--rust); border-color:var(--rust); color:#fff;}

  .searchwrap{padding:6px 16px 10px;}
  .searchwrap input{
    width:100%; background:var(--bg-card); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif;
  }
  .searchwrap input::placeholder{color:var(--text-faint);}

  main{padding:6px 16px 20px;}
  .empty{text-align:center; padding:60px 20px; color:var(--text-faint);}
  .empty .display{font-size:16px; color:var(--text-dim); margin-bottom:6px;}

  .card{
    position:relative; background:var(--bg-card); border:1px solid var(--border);
    border-left:3px dashed var(--border-hi); border-radius:var(--radius);
    padding:13px 14px 13px 20px; margin-bottom:10px; cursor:pointer;
  }
  .card:active{background:var(--bg-card-hi);}
  .card.rejected{opacity:0.5;}
  .card.rejected .card-name{text-decoration:line-through;}
  .card::before{
    content:''; position:absolute; left:-3px; top:16px; width:9px; height:9px; border-radius:50%;
    background:var(--bg); border:1px solid var(--border-hi);
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-name{font-size:15px; font-weight:600; color:var(--text); line-height:1.3;}
  .card-cat{font-size:11px; color:var(--text-faint); margin-top:2px; text-transform:uppercase; letter-spacing:0.4px;}
  .stamp{
    flex:0 0 auto; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    padding:4px 8px; border-radius:4px; border:1.5px solid; transform:rotate(-2deg); white-space:nowrap;
  }
  .card-bottom{display:flex; justify-content:space-between; align-items:flex-end; margin-top:10px;}
  .card-meta{font-size:11.5px; color:var(--text-dim); display:flex; gap:10px; flex-wrap:wrap;}
  .card-price{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--brass); font-weight:600;}
  .card-notes{font-size:12px; color:var(--text-faint); margin-top:6px; font-style:italic;}

  .cluster{border:1px solid var(--border-hi); border-radius:var(--radius); margin-bottom:14px; overflow:hidden; background:linear-gradient(180deg, rgba(201,154,61,0.06), transparent 45%);}
  .cluster-head{
    display:flex; align-items:center; gap:8px; padding:10px 14px; font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.4px; color:var(--brass);
    border-bottom:1px dashed var(--border-hi); background:rgba(201,154,61,0.08);
  }
  .cluster-count{margin-left:auto; font-weight:500; color:var(--text-faint); text-transform:none; letter-spacing:0; font-size:11px;}
  .candidate{padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer;}
  .candidate:last-child{border-bottom:none;}
  .candidate:active{background:var(--bg-card-hi);}
  .candidate.rejected{opacity:0.5;}
  .candidate.rejected .candidate-name{text-decoration:line-through;}
  .candidate-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
  .candidate-name{font-size:14px; font-weight:600;}
  .candidate-meta{font-size:11.5px; color:var(--text-dim); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;}
  .candidate-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .pick-btn{background:var(--rust); color:#fff; border:none; padding:6px 12px; border-radius:7px; font-size:11px; font-weight:700; cursor:pointer;}
  .pick-btn:active{background:var(--rust-hi);}

  .url-link{color:var(--brass); text-decoration:underline; font-size:11.5px;}
  .url-link:active{color:var(--rust-hi);}

  .fab{
    position:fixed; right:18px; bottom:22px; z-index:30; width:56px; height:56px; border-radius:50%;
    background:var(--rust); color:#fff; border:none; font-size:26px; box-shadow:0 6px 18px rgba(181,80,42,0.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .fab:active{background:var(--rust-hi);}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40; display:none; align-items:flex-end;}
  .overlay.show{display:flex;}
  .sheet{
    background:var(--bg-card); width:100%; max-height:88vh; overflow-y:auto;
    border-radius:16px 16px 0 0; border-top:1px solid var(--border-hi);
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-handle{width:36px; height:4px; background:var(--border-hi); border-radius:3px; margin:0 auto 14px;}
  .sheet h2{font-size:17px; margin:0 0 14px; font-weight:600;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; background:#171410; border:1px solid var(--border); color:var(--text);
    padding:10px 11px; border-radius:8px; font-size:15px; font-family:'Inter',sans-serif;
  }
  .field textarea{resize:vertical; min-height:50px;}
  .hint{font-size:11px; color:var(--text-faint); margin-top:4px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .price-row{display:flex; gap:8px;}
  .price-row input{flex:1;}
  .currency-toggle{display:flex; gap:4px;}
  .cur-opt{
    width:42px; display:flex; align-items:center; justify-content:center; border-radius:8px;
    border:1.5px solid var(--border); color:var(--text-dim); font-weight:700; font-size:15px; cursor:pointer;
  }
  .cur-opt.sel{color:#fff;}
  .status-grid{display:flex; flex-wrap:wrap; gap:6px;}
  .status-opt{
    padding:7px 12px; border-radius:8px; border:1.5px solid var(--border); font-size:12.5px;
    cursor:pointer; color:var(--text-dim); font-weight:600;
  }
  .status-opt.sel{color:#fff;}

  .sheet-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; padding:12px; border-radius:9px; border:none; font-size:14.5px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--rust); color:#fff;}
  .btn-primary:active{background:var(--rust-hi);}
  .btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text-dim);}
  .btn-danger{background:transparent; border:1px solid var(--danger); color:var(--danger);}
  .btn-danger.confirm{background:var(--danger); color:#fff;}

  .loading{padding:80px 20px; text-align:center; color:var(--text-faint);}

  .save-error{display:none; color:var(--danger); font-size:12px; margin-top:10px; text-align:center; line-height:1.4;}

  .toast{
    position:fixed; left:16px; right:16px; bottom:90px; z-index:50;
    background:var(--bg-card-hi); border:1px solid var(--border-hi); color:var(--text);
    padding:11px 14px; border-radius:9px; font-size:13px; text-align:center;
    opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .2s, transform .2s;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{border-color:var(--danger); color:#f0b3ab;}

  .menu{
    position:fixed; top:60px; right:16px; z-index:35; background:var(--bg-card-hi);
    border:1px solid var(--border-hi); border-radius:10px; overflow:hidden; display:none;
    min-width:180px; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .menu.show{display:block;}
  .menu-item{padding:12px 14px; font-size:13.5px; color:var(--text-dim); cursor:pointer; border-bottom:1px solid var(--border);}
  .menu-item:last-child{border-bottom:none;}
  .menu-item.danger{color:var(--danger);}
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>Гараж<span>.</span> Запчасти</h1>
    <div style="display:flex; gap:8px;">
      <div class="icon-btn" id="menuBtn">⋮</div>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Деталей</div></div>
    <div class="stat"><div class="n" id="statPct">0%</div><div class="l">Установлено</div></div>
    <div class="stat"><div class="n" id="statSpentUSD">$0</div><div class="l">Потрачено</div></div>
    <div class="stat"><div class="n" id="statSpentEUR">€0</div><div class="l">Потрачено</div></div>
  </div>
  <div class="gauge" id="gauge"></div>
</header>

<div class="filters" id="filters"></div>
<div class="searchwrap"><input type="text" id="search" placeholder="Поиск по названию, номеру, категории…"></div>

<main id="list"></main>

<div class="toast" id="toast"></div>

<button class="fab" id="addBtn">+</button>

<div class="menu" id="menu">
  <div class="menu-item" id="copyListBtn">📋 Скопировать список</div>
  <div class="menu-item" id="csvBtn">📊 Открыть в Таблицах (CSV)</div>
  <div class="menu-item" id="exportBtn">⬇️ Резервная копия (JSON)</div>
  <div class="menu-item" id="importBtn">⬆️ Восстановить из файла</div>
  <div class="menu-item danger" id="clearAllBtn">Очистить всё</div>
</div>
<input type="file" id="importFile" accept="application/json" style="display:none;">

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="sheetTitle">Добавить деталь</h2>
    <div class="field">
      <label>Название</label>
      <input type="text" id="f_name" placeholder="Напр. Корзина сцепления Barnett">
    </div>
    <div class="field">
      <label>Группа сравнения</label>
      <input type="text" id="f_group" placeholder="Напр. Корзина сцепления">
      <div class="hint">Заполни одинаково у нескольких вариантов — они схлопнутся в блок сравнения с кнопкой «выбрать»</div>
    </div>
    <div class="field">
      <label>Категория</label>
      <select id="f_category"></select>
    </div>
    <div class="field">
      <label>Цена</label>
      <div class="price-row">
        <input type="number" id="f_price" placeholder="0" inputmode="decimal">
        <div class="currency-toggle" id="currencyToggle"></div>
      </div>
    </div>
    <div class="field">
      <label>Статус</label>
      <div class="status-grid" id="statusGrid"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Поставщик</label>
        <input type="text" id="f_vendor" placeholder="Напр. Ebay / магазин">
      </div>
      <div class="field">
        <label>№ детали</label>
        <input type="text" id="f_partnum" placeholder="OEM / артикул">
      </div>
    </div>
    <div class="field">
      <label>Ссылка на товар</label>
      <input type="url" id="f_url" placeholder="https://...">
    </div>
    <div class="field">
      <label>Заметка</label>
      <textarea id="f_notes" placeholder="Совместимость, состояние..."></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelBtn">Отмена</button>
      <button class="btn btn-primary" id="saveBtn">Сохранить</button>
    </div>
    <div class="save-error" id="saveError"></div>
    <div class="sheet-actions" id="deleteRow" style="display:none;">
      <button class="btn btn-danger" id="deleteBtn">Удалить деталь</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyY4Ka5a9Qz8TCqw0PAFyXVJdR8kDXDbbzale8Tv0PCuX0B6tqwpa9C6Qcg0w1Zp6xB/exec';
let loadError = false;
let lastErrorDetail = '';

const CATEGORIES = [
  'Двигатель',
  'Трансмиссия/Привод',
  'Топливо и выхлоп',
  'Электрика',
  'Рама и ходовая часть',
  'Кузов и отделка',
  'Органы управления',
  'Крепёж и расходники',
  'Прочее'
];

// forward pipeline (used for tap-to-cycle, gauge, % installed)
const STATUSES = [
  {key:'considering', label:'Выбираю',      color:'#8a6fa8'},
  {key:'needed',       label:'Нужно',        color:'#b23a2e'},
  {key:'ordered',      label:'Заказано',     color:'#c99a3d'},
  {key:'transit',      label:'В пути',       color:'#5b7c8d'},
  {key:'received',     label:'Получено',     color:'#7d9463'},
  {key:'installed',    label:'Установлено',  color:'#5c8a4a'},
];
const REJECTED = {key:'rejected', label:'Отклонено', color:'#6b6558'};
const ALL_STATUSES = [...STATUSES, REJECTED];
const statusMap = Object.fromEntries(ALL_STATUSES.map(s=>[s.key,s]));

const CURRENCIES = [
  {key:'USD', symbol:'$'},
  {key:'EUR', symbol:'€'},
];

let parts = [];
let filterStatus = 'all';
let searchQuery = '';
let editingId = null;
let formStatus = 'needed';
let formCurrency = 'USD';
let deleteConfirmPending = false;
let clearConfirmPending = false;

const $ = id => document.getElementById(id);

async function loadParts(){
  $('list').innerHTML = '<div class="loading">Открываем гараж…</div>';
  try{
    const res = await fetch(SCRIPT_URL, {method:'GET'});
    if(!res.ok){
      let txt = '';
      try{ txt = await res.text(); }catch(e2){}
      throw new Error('HTTP '+res.status+(txt?': '+txt.slice(0,180):''));
    }
    const data = await res.json();
    parts = Array.isArray(data) ? data : [];
    loadError = false;
    lastErrorDetail = '';
  }catch(e){
    console.error('Load error', e);
    parts = [];
    loadError = true;
    lastErrorDetail = (e && e.message) ? e.message : String(e);
  }
  render();
}

async function saveParts(){
  try{
    const res = await fetch(SCRIPT_URL, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(parts)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    if(!data || data.ok !== true) throw new Error(data && data.error ? data.error : 'unknown response');
    return true;
  }catch(e){
    console.error('Storage error', e);
    return false;
  }
}

function showToast(msg, isError){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>{ t.classList.remove('show'); }, 3200);
}

function fmtMoney(n, currency){
  const c = CURRENCIES.find(x=>x.key===currency) || CURRENCIES[0];
  return c.symbol + Number(n||0).toLocaleString('en-US');
}

function buildFilters(){
  const el = $('filters');
  const all = [{key:'all', label:'Все', color:'#9c9483'}, ...ALL_STATUSES];
  el.innerHTML = all.map(s => `<div class="chip ${filterStatus===s.key?'active':''}" data-status="${s.key}">${s.label}</div>`).join('');
  el.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{ filterStatus = c.dataset.status; render(); });
  });
}

function buildStatusGrid(){
  const el = $('statusGrid');
  el.innerHTML = ALL_STATUSES.map(s=>`
    <div class="status-opt ${formStatus===s.key?'sel':''}" data-key="${s.key}"
      style="border-color:${s.color}; ${formStatus===s.key?`background:${s.color};`:''}">${s.label}</div>
  `).join('');
  el.querySelectorAll('.status-opt').forEach(o=>{
    o.addEventListener('click', ()=>{ formStatus = o.dataset.key; buildStatusGrid(); });
  });
}

function buildCurrencyToggle(){
  const el = $('currencyToggle');
  el.innerHTML = CURRENCIES.map(c=>`
    <div class="cur-opt ${formCurrency===c.key?'sel':''}" data-key="${c.key}"
      style="border-color:${formCurrency===c.key?'var(--brass)':'var(--border)'}; ${formCurrency===c.key?'background:var(--brass);':''}">${c.symbol}</div>
  `).join('');
  el.querySelectorAll('.cur-opt').forEach(o=>{
    o.addEventListener('click', ()=>{ formCurrency = o.dataset.key; buildCurrencyToggle(); });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str||'';
  return d.innerHTML;
}

function escapeAttr(str){
  return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function normalizeUrl_(v){
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)) return 'https://' + v;
  return v;
}

function matchesFilterSearch(p){
  if(filterStatus!=='all' && p.status!==filterStatus) return false;
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    const hay = [(p.name||''),(p.category||''),(p.partNumber||''),(p.vendor||'')].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const active = parts.filter(p=>p.status!=='rejected');
  const total = active.length;
  const installedCount = parts.filter(p=>p.status==='installed').length;
  const pct = total ? Math.round(installedCount/total*100) : 0;
  const spentUSD = active.reduce((s,p)=> s + ((p.currency||'USD')==='USD' ? (Number(p.price)||0) : 0), 0);
  const spentEUR = active.reduce((s,p)=> s + ((p.currency||'USD')==='EUR' ? (Number(p.price)||0) : 0), 0);

  $('statTotal').textContent = total;
  $('statPct').textContent = pct + '%';
  $('statSpentUSD').textContent = fmtMoney(spentUSD,'USD');
  $('statSpentEUR').textContent = fmtMoney(spentEUR,'EUR');

  const gauge = $('gauge');
  if(total===0){ gauge.innerHTML=''; }
  else{
    gauge.innerHTML = STATUSES.map(s=>{
      const cnt = active.filter(p=>p.status===s.key).length;
      const w = (cnt/total*100);
      return w>0 ? `<div style="width:${w}%; background:${s.color};"></div>` : '';
    }).join('');
  }

  buildFilters();

  // group by compareGroup
  const groups = {};
  parts.forEach(p=>{
    const g = (p.compareGroup||'').trim();
    if(g){ (groups[g] = groups[g]||[]).push(p); }
  });
  const clusterNames = Object.keys(groups).filter(g=>groups[g].length>=2);
  const clusteredIds = new Set();
  clusterNames.forEach(g=> groups[g].forEach(p=>clusteredIds.add(p.id)));
  const clustersToShow = clusterNames.filter(g=> groups[g].some(matchesFilterSearch));

  let individual = parts.filter(p=> !clusteredIds.has(p.id) && matchesFilterSearch(p));
  individual = individual.slice().sort((a,b)=> (b.dateUpdated||0) - (a.dateUpdated||0));

  const listEl = $('list');

  if(individual.length===0 && clustersToShow.length===0){
    if(loadError){
      listEl.innerHTML = `<div class="empty"><div class="display">Не загрузилось</div>Не удалось получить данные из таблицы.<div class="mono" style="font-size:10.5px; color:var(--text-faint); margin-top:8px; word-break:break-all;">${escapeHtml(lastErrorDetail)}</div><button class="btn btn-ghost" id="retryLoadBtn" style="margin-top:14px; max-width:160px; margin-left:auto; margin-right:auto;">Повторить</button></div>`;
      const rb = document.getElementById('retryLoadBtn');
      if(rb) rb.addEventListener('click', loadParts);
      return;
    }
    listEl.innerHTML = `<div class="empty"><div class="display">Пусто</div>Добавь первую деталь кнопкой «+»</div>`;
    return;
  }

  let html = '';

  clustersToShow.forEach(g=>{
    const members = groups[g].slice().sort((a,b)=> (b.dateUpdated||0)-(a.dateUpdated||0));
    html += `<div class="cluster"><div class="cluster-head">🔀 <span>${escapeHtml(g)}</span><span class="cluster-count">${members.length} варианта</span></div>`;
    members.forEach(p=>{
      const st = statusMap[p.status] || STATUSES[1];
      html += `
      <div class="candidate ${p.status==='rejected'?'rejected':''}" data-id="${p.id}">
        <div class="candidate-top">
          <div class="candidate-name">${escapeHtml(p.name)}</div>
          <div class="stamp stamp-toggle" data-id="${p.id}" style="color:${st.color}; border-color:${st.color};">${st.label}</div>
        </div>
        <div class="candidate-meta">
          ${p.vendor ? `<span>${escapeHtml(p.vendor)}</span>`:''}
          ${p.partNumber ? `<span class="mono">#${escapeHtml(p.partNumber)}</span>`:''}
          ${p.url ? `<a class="url-link" href="${escapeAttr(p.url)}" target="_blank" rel="noopener noreferrer">🔗 Ссылка</a>`:''}
        </div>
        <div class="candidate-bottom">
          <div>${p.price ? `<span class="card-price">${fmtMoney(Number(p.price), p.currency||'USD')}</span>` : ''}</div>
          ${p.status==='considering' ? `<button class="pick-btn" data-pick="${p.id}">Выбрать эту</button>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  individual.forEach(p=>{
    const st = statusMap[p.status] || STATUSES[1];
    html += `
    <div class="card ${p.status==='rejected'?'rejected':''}" data-id="${p.id}">
      <div class="card-top">
        <div>
          <div class="card-name">${escapeHtml(p.name)}</div>
          <div class="card-cat">${escapeHtml(p.category||'Прочее')}</div>
        </div>
        <div class="stamp stamp-toggle" data-id="${p.id}" style="color:${st.color}; border-color:${st.color};">${st.label}</div>
      </div>
      <div class="card-bottom">
        <div class="card-meta">
          ${p.vendor ? `<span>${escapeHtml(p.vendor)}</span>`:''}
          ${p.partNumber ? `<span class="mono">#${escapeHtml(p.partNumber)}</span>`:''}
          ${p.url ? `<a class="url-link" href="${escapeAttr(p.url)}" target="_blank" rel="noopener noreferrer">🔗 Ссылка</a>`:''}
        </div>
        ${p.price ? `<div class="card-price">${fmtMoney(Number(p.price), p.currency||'USD')}</div>`:''}
      </div>
      ${p.notes ? `<div class="card-notes">${escapeHtml(p.notes)}</div>`:''}
    </div>`;
  });

  listEl.innerHTML = html;

  listEl.querySelectorAll('.card, .candidate').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.stamp-toggle') || e.target.closest('.pick-btn') || e.target.closest('.url-link')) return;
      openEdit(card.dataset.id);
    });
  });
  listEl.querySelectorAll('.stamp-toggle').forEach(st=>{
    st.addEventListener('click', (e)=>{ e.stopPropagation(); cycleStatus(st.dataset.id); });
  });
  listEl.querySelectorAll('.pick-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); pickWinner(btn.dataset.pick); });
  });
}

function cycleStatus(id){
  const p = parts.find(x=>x.id===id);
  if(!p) return;
  const idx = STATUSES.findIndex(s=>s.key===p.status);
  p.status = STATUSES[(idx+1)%STATUSES.length].key;
  p.dateUpdated = Date.now();
  saveParts();
  render();
}

function pickWinner(id){
  const winner = parts.find(x=>x.id===id);
  if(!winner) return;
  const grp = (winner.compareGroup||'').trim();
  winner.status = 'needed';
  winner.dateUpdated = Date.now();
  if(grp){
    parts.forEach(p=>{
      if(p.id!==winner.id && (p.compareGroup||'').trim()===grp && p.status==='considering'){
        p.status = 'rejected';
        p.dateUpdated = Date.now();
      }
    });
  }
  saveParts();
  render();
}

function openAdd(){
  editingId = null;
  formStatus = 'considering';
  formCurrency = 'USD';
  $('sheetTitle').textContent = 'Добавить деталь';
  $('f_name').value=''; $('f_group').value=''; $('f_price').value=''; $('f_vendor').value='';
  $('f_partnum').value=''; $('f_url').value=''; $('f_notes').value='';
  $('f_category').value = CATEGORIES[0];
  $('deleteRow').style.display = 'none';
  deleteConfirmPending = false;
  $('saveError').style.display = 'none';
  buildStatusGrid();
  buildCurrencyToggle();
  $('overlay').classList.add('show');
}

function openEdit(id){
  const p = parts.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  formStatus = p.status;
  formCurrency = p.currency || 'USD';
  $('sheetTitle').textContent = 'Изменить деталь';
  $('f_name').value = p.name||'';
  $('f_group').value = p.compareGroup||'';
  $('f_price').value = p.price||'';
  $('f_vendor').value = p.vendor||'';
  $('f_partnum').value = p.partNumber||'';
  $('f_url').value = p.url||'';
  $('f_notes').value = p.notes||'';
  $('f_category').value = p.category || CATEGORIES[0];
  $('deleteRow').style.display = 'flex';
  deleteConfirmPending = false;
  $('saveError').style.display = 'none';
  $('deleteBtn').textContent = 'Удалить деталь';
  $('deleteBtn').classList.remove('confirm');
  buildStatusGrid();
  buildCurrencyToggle();
  $('overlay').classList.add('show');
}

function closeSheet(){ $('overlay').classList.remove('show'); }

async function saveForm(){
  const name = $('f_name').value.trim();
  if(!name){ $('f_name').focus(); return; }
  const data = {
    name,
    compareGroup: $('f_group').value.trim(),
    category: $('f_category').value,
    price: $('f_price').value ? Number($('f_price').value) : null,
    currency: formCurrency,
    vendor: $('f_vendor').value.trim(),
    partNumber: $('f_partnum').value.trim(),
    url: normalizeUrl_($('f_url').value.trim()),
    notes: $('f_notes').value.trim(),
    status: formStatus,
    dateUpdated: Date.now(),
  };
  let addedId = null;
  if(editingId){
    const idx = parts.findIndex(x=>x.id===editingId);
    if(idx>-1) parts[idx] = {...parts[idx], ...data};
  }else{
    addedId = (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+Math.random());
    data.id = addedId;
    data.dateAdded = Date.now();
    parts.push(data);
  }

  $('saveBtn').disabled = true;
  $('saveBtn').textContent = 'Сохраняю…';
  $('saveError').style.display = 'none';
  const ok = await saveParts();
  $('saveBtn').disabled = false;
  $('saveBtn').textContent = 'Сохранить';

  if(ok){
    closeSheet();
    render();
  }else{
    if(addedId){ editingId = addedId; $('deleteRow').style.display = 'flex'; $('sheetTitle').textContent = 'Изменить деталь'; }
    $('saveError').style.display = 'block';
    $('saveError').textContent = '⚠ Не сохранилось на сервере (временный сбой). Данные остались в форме — нажми «Сохранить» ещё раз.';
    render();
  }
}

async function deletePart(){
  if(!deleteConfirmPending){
    deleteConfirmPending = true;
    $('deleteBtn').textContent = 'Точно удалить? Нажми ещё раз';
    $('deleteBtn').classList.add('confirm');
    return;
  }
  const backup = parts;
  parts = parts.filter(x=>x.id!==editingId);
  $('deleteBtn').disabled = true;
  const ok = await saveParts();
  $('deleteBtn').disabled = false;
  if(ok){
    closeSheet();
    render();
  }else{
    parts = backup;
    deleteConfirmPending = false;
    $('deleteBtn').textContent = 'Удалить деталь';
    $('deleteBtn').classList.remove('confirm');
    $('saveError').style.display = 'block';
    $('saveError').textContent = '⚠ Не удалось удалить — временный сбой сервера. Попробуй ещё раз.';
  }
}

async function clearAll(){
  if(!clearConfirmPending){
    clearConfirmPending = true;
    $('clearAllBtn').textContent = 'Точно очистить? Нажми ещё раз';
    setTimeout(()=>{ clearConfirmPending=false; $('clearAllBtn').textContent='Очистить всё'; }, 4000);
    return;
  }
  const backup = parts;
  parts = [];
  const ok = await saveParts();
  clearConfirmPending = false;
  $('clearAllBtn').textContent = 'Очистить всё';
  if(ok){
    $('menu').classList.remove('show');
    render();
  }else{
    parts = backup;
    showToast('Не удалось очистить — временный сбой сервера. Попробуй ещё раз.', true);
  }
}

function copyList(){
  const lines = parts.map(p=>{
    const st = statusMap[p.status]?.label || p.status;
    return `• ${p.name} [${st}]${p.category?` — ${p.category}`:''}${p.price?` — ${fmtMoney(Number(p.price), p.currency||'USD')}`:''}${p.partNumber?` — #${p.partNumber}`:''}`;
  }).join('\n');
  const text = `Список запчастей (${parts.length}):\n${lines}`;
  try{
    navigator.clipboard.writeText(text).then(()=>{
      $('copyListBtn').textContent = '✓ Скопировано';
      setTimeout(()=>{ $('copyListBtn').textContent='📋 Скопировать список'; }, 1500);
    }).catch(()=>{ fallbackCopy(text); });
  }catch(e){ fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function toCsvField(v){
  const s = (v===null||v===undefined) ? '' : String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function exportCsv(){
  const headers = ['Название','Группа сравнения','Категория','Статус','Цена','Валюта','Поставщик','№ детали','Ссылка','Заметка','Добавлено','Обновлено'];
  const rows = parts.map(p=>{
    const st = statusMap[p.status] ? statusMap[p.status].label : p.status;
    return [
      p.name, p.compareGroup||'', p.category||'', st,
      (p.price===null||p.price===undefined)?'':p.price, p.currency||'USD',
      p.vendor||'', p.partNumber||'', p.url||'', p.notes||'',
      p.dateAdded ? new Date(p.dateAdded).toLocaleDateString('ru-RU') : '',
      p.dateUpdated ? new Date(p.dateUpdated).toLocaleDateString('ru-RU') : ''
    ];
  });
  const csv = [headers, ...rows].map(r=>r.map(toCsvField).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `harley-parts-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  $('menu').classList.remove('show');
}

function exportBackup(){
  try{
    const data = JSON.stringify(parts, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `harley-parts-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ console.error('Export error', e); }
  $('menu').classList.remove('show');
}

function triggerImport(){
  $('menu').classList.remove('show');
  $('importFile').click();
}

function mergeImported(data){
  data.forEach(imp=>{
    if(!imp || !imp.id || !imp.name) return;
    const idx = parts.findIndex(p=>p.id===imp.id);
    if(idx===-1){ parts.push(imp); }
    else if((imp.dateUpdated||0) > (parts[idx].dateUpdated||0)){ parts[idx] = imp; }
  });
}

async function handleImportFile(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const backup = parts;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!Array.isArray(data)) throw new Error('format');
    mergeImported(data);
    const ok = await saveParts();
    if(!ok){
      parts = backup;
      showToast('Сервер не подтвердил сохранение — попробуй ещё раз.', true);
    }else{
      render();
      showToast(`Восстановлено записей: ${data.length}`);
    }
  }catch(err){
    parts = backup;
    showToast('Не удалось прочитать файл резервной копии.', true);
  }
}

CATEGORIES.forEach(c=>{
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c;
  $('f_category').appendChild(opt);
});

$('addBtn').addEventListener('click', openAdd);
$('cancelBtn').addEventListener('click', closeSheet);
$('saveBtn').addEventListener('click', saveForm);
$('deleteBtn').addEventListener('click', deletePart);
$('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeSheet(); });
$('search').addEventListener('input', (e)=>{ searchQuery = e.target.value; render(); });
$('menuBtn').addEventListener('click', ()=> $('menu').classList.toggle('show'));
$('copyListBtn').addEventListener('click', copyList);
$('csvBtn').addEventListener('click', exportCsv);
$('exportBtn').addEventListener('click', exportBackup);
$('importBtn').addEventListener('click', triggerImport);
$('importFile').addEventListener('change', handleImportFile);
$('clearAllBtn').addEventListener('click', clearAll);
document.addEventListener('click', (e)=>{
  if(!e.target.closest('#menu') && !e.target.closest('#menuBtn')){
    $('menu').classList.remove('show');
  }
});

loadParts();
</script>
